spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/propostadb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
# Local default only; use versioned migrations for production.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

rabbitmq.propostapendente.exchange=${PROPOSAL_PENDING_EXCHANGE:proposta-pendente.ex}
